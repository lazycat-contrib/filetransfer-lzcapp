version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: file-transfer

build:
  run_buildscript: false

images:
  - id: file-transfer
    target: service
    service: file-transfer
    source: docker.io/matrixseven/file-transfer-go
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
    application:
      language: zh
      name: 文件快传
      source: https://github.com/MatrixSeven/file-transfer-go
      source_author: MatrixSeven
  private:
    enabled: true
    skip_if_version_exists: true
    name: 文件快传
    summary: 由 GitHub Actions 自动发布
